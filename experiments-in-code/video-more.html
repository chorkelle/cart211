<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowy Video</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }

        /*----------------
         Video size buttons omg im falling asleep 
         -----------------*/

        /* Adds space below the group of buttons */
        .size-controls {
            margin-bottom: 15px;
        }

        /* Style all buttons inside the size-control section*/
        .size-controls button {
            padding: 8px 14px;
            /*Adds space inside each button*/
            margin: 3px;
            /*Adds space between each button*/
            cursor: pointer;
            /*changes the mouse pointer to a hand*/
        }

        /*--------------------------
         General Video Player Styles 
         ---------------------------*/

        /*Applies these styles to the video player*/
        video {
            display: block;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16/9;
            height: auto;
            /*Makes changes in the video appear smoothly*/
            transition: width 0.3s ease;
        }

        /*-------------------
        Different Video Sizes 
         --------------------*/

        /*Small Video: 320px wide*/
        video.small {
            width: 320px;
        }

        video.medium {
            width: 480px;
        }

        video.large {
            width: 720px;
        }

        video.full {
            width: 100%;
        }
    </style>
</head>

<body>
    <!-- Comment -->
    <h1>Snowy Video Again</h1>
    <p>Watch the video below!</p>

    <!-------------------------
    Video Size Control Buttons
    --------------------------->

    <!-- Group the buttons together -->
    <div class="size-controls">

        <!-- Tells visitors what the buttons control -->
        <strong>Video Size:</strong>

        <!-- Calls the Javascript function and changes the video width to 320px when clicked -->
        <button onclick="changeSize('small')">Small</button>

        <!-- Changes video width to 480px -->
        <button onclick="changeSize('medium')">Medium</button>

        <!-- Changes video width to 720px -->
        <button onclick="changeSize('large')">Large</button>

        <!-- Changes video width to available content width -->
        <button onclick="changeSize('full')">Full Width</button>

    </div>

    <!----------------
        Video Player
    ------------------>

    <!-- id="myVideo" gives the video a unique name that JS can use to find it
     
    class="full" makes the video start at full width
    
    controls displays the built-in play, pause, volume, and other controls.-->

    <video id="myVideo" class="full" controls>

        <source src="video.mp4" type="video/mp4">
        Sorry, your browser cannot play this video.

    </video>

    <!-- Javascript: Change Video Size -->
    <script>
        // This function runs whenever a size button is clicked.
        // the word "size" receives the value from the button.
        // Such as "small", "medium", "large", or "full".

        function changeSize(size) {

            // Finds the video element using its unique ID.

            const video = document.getElementById("myVideo");

            // Remove all four possible size classes
            // This prevents the old size settings from remaining active
            video.classList.remove(
                "small",
                "medium",
                "large",
                "full"
            );

            // Adds the new size class selected by the visitor
            // The CSS then applies the matching width
            video.classList.add(size);

        }

    </script>

</body>

</html>
