    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Sofia|Audiowide|Trirong|Darumadrop+One&display=swap">

    <style>
        h1.a {
            font-family: "Sofia", sans-serif;
            font-weight: 400;
            font-style: normal;

        }

        h1.b {
            font-family: "Audiowide", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        h1.c {
            font-family: "Trirong", serif;
            font-weight: 400;
            font-style: normal;
        }

        h1.d {
            font-family: "Darumadrop One", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        p.a {
            font-family: "Darumadrop One", sans-serif;
            font-style: normal;
        }

        p.b {
            font-family: "Darumadrop One", sans-serif;
            font-style: normal;
        }
    </style>

</head>

<body>
    <h1 class="a">Sofia Font</h1>
    <h1 class="b">Audiowide Font</h1>
    <h1 class="c">Trirong Font</h1>
    <h1 class="d">Darumadrop One</h1>

    <p class="a">Lorem ipsum dolor sit amet</p>
    <p class="b">1234567890</p>

</body>
