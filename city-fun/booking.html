<!DOCTYPE html>
<!-- Tells the browser that this document uses HTML5. -->

<html lang="en">
<!-- The page content is written in English. -->

<head>
    <!-- The head contains information about the page, not the visible page content. -->

    <!-- Sets the character encoding so special characters display correctly. -->
    <meta charset="UTF-8">

    <!-- The title appears in the browser tab. -->
    <title>Welcome to Heaven! | Cart 211 final</title>

    <!-- A short description of the page used by search engines. -->
    <meta name="description" content="Welcome to Heaven! A fake city webpage for Cart 211 Fall 2026 final.">


    <!-- Adds a small icon to the browser tab. -->
    <link rel="icon" href="assets/favicon.ico">

    <!-- Identifies the author and copyright information. -->
    <meta name="author" content="Charlotte Walsh">
    <meta name="copyright" content="© Charlotte Walsh, student project, 2026">

    <link rel="stylesheet" href="default.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div id="wrapper">

        <!-- BACKGROUND IMAGE -->
        <div>
            <figure class="background-photo_booking">
                <img src="assets/city.jpg" class="booking_im" alt="City landscape portait">
            </figure>
        </div>

        <section class="content">

            <article>

                <div class="booking-sheet">
                    <h2>Book with us!</h2>
                    <p>Sign up to plan and save your city visits.</p>

                    <form class="booking-form" id="signup-form">
                        <label class="booking-box" for="name">Name</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>

                        <label class="booking-box" for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>

                        <button class="booking-button" type="submit">Proceed</button>
                    </form>
                </div>
            </article>
        </section>
    </div>
    <!-- End of social section. -->

    </footer>
    <!-- End of footer. -->

    </div>
    <!-- End of the main wrapper. -->

    <script>
        document.getElementById("signup-form").addEventListener("submit", function (event) {
            event.preventDefault();
            sessionStorage.setItem("signupName", document.getElementById("name").value.trim());
            window.location.href = "home.html";
        });
    </script>

</body>

</html>
