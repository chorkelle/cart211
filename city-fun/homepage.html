<!DOCTYPE html>
<!-- Tells the browser that this document uses HTML5. -->

<html lang="en">
<!-- The page content is written in English. -->

<head>
    <!-- The head contains information about the page, not the visible page content. -->

    <!-- Sets the character encoding so special characters display correctly. -->
    <meta charset="UTF-8">

    <!-- The title appears in the browser tab. -->
    <title>Welcome to XXX | Cart 211 final</title>

    <!-- A short description of the page used by search engines. -->
    <meta name="description" content="Welcome to XXX! A fake city webpage for Cart 211 Fall 2026 final.">

    <!-- MISSING INFO -->

    <!-- Open Graph metadata controls how the page looks when shared on social media. -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="Welcome to XXX!">
    <meta property="og:description" content="A fake city webpage for Cart 211 final.">

    <!-- The page URL and image used in social media previews. -->
    <meta property="og:url" content="https://hybrid.concordia.ca/yourname/hony/ms-america.html">
    <meta property="og:image" content="https://hybrid.concordia.ca/yourname/hony/assets/america_pageant_og.jpg">

    <!-- The dimensions and alternative description of the preview image. -->
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Portrait associated with the Ms. America pageant story">

    <!-- Twitter card metadata controls the appearance of shared links on X. -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Humans of New York — “Ms. America pageant”">
    <meta name="twitter:description" content="A Humans of New York story presented for CART 211.">
    <meta name="twitter:image" content="https://hybrid.concordia.ca/yourname/hony/assets/america_pageant_og.jpg">

    <!-- Identifies the preferred URL for this page to search engines. -->
    <link rel="canonical" href="https://hybrid.concordia.ca/yourname/hony/ms-america.html">

    <!-- MISSING INFO -->

    <!-- Adds a small icon to the browser tab. -->
    <link rel="icon" href="assets/favicon.ico">

    <!-- Identifies the author and copyright information. -->
    <meta name="author" content="Charlotte Walsh">
    <meta name="copyright" content="© Charlotte Walsh, student project, 2026">

    <!-- Connects this HTML file to the external CSS stylesheet. -->
    <!-- The CSS controls colours, fonts, spacing, layout, and responsiveness. -->
    <link rel="stylesheet" href="default.css">

    <!-- Makes the page adapt to the width of mobile devices. -->
    <!-- Without this, mobile browsers may display the page as if it were desktop-sized. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Loads Google Fonts that can be used in the CSS stylesheet. -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Varela+Round&display=swap" rel="stylesheet">

    <!-- Establishes an early connection to Google Fonts to help them load faster. -->
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <!-- Loads Libre Franklin, another font used by the website. -->
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100;0,400;0,900;1,100;1,900&display=swap"
        rel="stylesheet">

    <!-- Loads Font Awesome, a library of ready-made icons. -->
    <!-- The social media icons and hamburger menu use this library. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <!-- Everything inside the body is part of the visible webpage. -->

    <!-- Main wrapper: groups the page content together. -->
    <!-- CSS uses #wrapper to control the overall width and centre the content. -->
    <div id="wrapper">

        <!-- HEADER: contains the logo and navigation menu. -->
        <header>

            <!-- NAV: contains links that help visitors move around the website. -->
            <nav>



                <!-- Navigation links.
                     CSS displays these horizontally on desktop
                     and as a menu panel on smaller screens. -->
                <div class="menu1">

                    <!-- The X button closes the mobile navigation menu. -->
                    <button type="button" class="close-menu" aria-label="Close Navigation menu">
                        &times
                    </button>

                    <!-- Reopens the Home page -->
                    <a href="homepage.html" class="menuI">HOME</a>

                </div>

            </nav>
        </header>

        <!-- FIGURE 1: image, and caption. -->

        <figure class="background-photo">
            <img src="assets/city.jpg" class="main" alt="City landscape portait">


        </figure>



        <!-- SECTION: groups the main content of the page. -->
        <section class="content">

            <!-- ARTICLE: contains a related piece of written and visual content. -->
            <article>

                <!-- H1 is the main heading of the page. -->
                <!-- A page generally uses one main H1 heading. -->
                <h1>Welcome To XXX!</h1>

                <!-- Introductory paragraph.
                     The intro class lets CSS apply specific font and spacing styles. -->
                <p class="intro">
                    XXX
                </p>

                <!-- A second introductory paragraph explaining the project. -->
                <p class="intro">
                    XXX
                </p>


            </article>
        </section>

        <!-- FOOTER: contains social media icons and project credits. -->
        <footer>

            <!-- Groups the social icons and credits together. -->
            <section class="social-section">

                <div class="social-icons">

                    <a href="https://facebook.com" class="social facebook" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="https://instagram.com" class="social instagram" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="https://x.com" class="social twitter" aria-label="X">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>

                    <a href="https://tiktok.com" class="social tiktok" aria-label="TikTok">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>

                    <a href="https://youtube.com" class="social youtube" aria-label="YouTube">
                        <i class="fa-brands fa-youtube"></i>
                    </a>

                    <a href="https://linkedin.com" class="social linkedin" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                    <a href="https://github.com" class="social github" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>

                </div>
            </section>
            <!-- Credits identify the course project and source material. -->
            <div class="credits">
                <p>
                    © Charlotte Walsh, cart 211, fall 2025, assessment 5,
                    credits: humansofnyarchive.com
                </p>
            </div>

    </div>
    <!-- End of social section. -->

    </footer>
    <!-- End of footer. -->

    </div>
    <!-- End of the main wrapper. -->

</body>

</html>
