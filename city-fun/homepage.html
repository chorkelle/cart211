<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to XXX</title>
    <!-- The head contains information about the page, not the visible page content. -->

    <!-- Sets the character encoding so special characters display correctly. -->
    <meta charset="UTF-8">

    <!-- The title appears in the browser tab. -->
    <title>Welcome to XXX!</title>

    <!-- A short description of the page used by search engines. -->
    <meta name="description" content="Welcome to XXX. Final ten page website for CART 211.">

    <!-- Open Graph metadata controls how the page looks when shared on social media. -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="Welcome to XXX!">
    <meta property="og:description" content="Welcome to XXX! CART 211 final.">

    <!-- The page URL and image used in social media previews. -->
    <meta property="og:url" content="xxx">
    <meta property="og:image" content="xxx">

    <!-- Adds a small icon to the browser tab. -->
    <link rel="icon" href="assets/favicon.ico">
</head>

<body>

</body>

</html>
