<!DOCTYPE html>

<body>
    <video id="camera-stream" autoplay playsinline width="640" height="480"></video>
    <script>
        async function startCamera() {
            try {
                // Request camera access (prompts the user for permission)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }, // Use "environment" for rear camera
                    audio: false
                });

                // Attach the stream to the HTML <video> element
                const videoElement = document.getElementById('camera-stream');
                videoElement.srcObject = stream;
            } catch (error) {
                console.error("Camera access denied or unavailable:", error);
            }
        }

        startCamera();
    </script>

    <div id="wrapper">

        <header>

            <!-- BACKGROUND IMAGE -->
            <div>
                <figure class="background-photo_booking">
                    <img src="assets/city.jpg" class="booking_im" alt="City landscape portait">

                    <h2>See you soon.</h2>
                </div>
            </article>
        </section>

    </div>
    <!-- End of the main wrapper. -->


</body>
